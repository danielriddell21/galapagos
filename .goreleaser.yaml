version: 2

# Galapagos releases the headless binary, which has no display dependencies and
# cross-compiles cleanly. The windowed demo is built locally with `make gui` or
# for the browser with `make wasm`.
before:
  hooks:
    - go mod tidy

builds:
  - id: galapagos
    main: ./cmd/galapagos
    binary: galapagos
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: galapagos
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

brews:
  - name: galapagos
    repository:
      owner: danielriddell21
      name: homebrew-tap
    homepage: https://github.com/danielriddell21/galapagos
    description: Visualize learning algorithms in real time
    license: MIT

release:
  draft: true
